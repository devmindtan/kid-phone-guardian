<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef3f8">
  <title>Tín hiệu nhà</title>
  <style>
    :root {
      --bg: #eef3f8;
      --bg-grid: rgba(18, 26, 38, 0.045);
      --surface: #ffffff;
      --surface-soft: #f7fafd;
      --ink: #121a26;
      --muted: #5b6b7c;
      --line: #d8e2ee;
      --accent: #c2410c;
      --accent-strong: #9a3412;
      --accent-tint: #fff1e8;
      --teal: #0f766e;
      --teal-tint: #e6f4f1;
      --danger: #b42318;
      --danger-tint: #fef3f2;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow-md: 0 14px 34px -22px rgba(16, 24, 40, 0.42);
      --radius: 18px;
      --display: "Futura", "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.5;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-grid) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    main {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 34px 20px 72px;
    }

    /* Hero */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 30px;
      animation: rise .55s ease-out both;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: .9rem;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: .02em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 6px 14px -8px rgba(15, 118, 110, .9);
    }
    .brand-mark svg { width: 20px; height: 20px; }
    h1 {
      margin: 20px 0 10px;
      font-family: var(--display);
      font-size: clamp(2.1rem, 4.8vw, 3.3rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.035em;
    }
    .lead {
      margin: 0;
      max-width: 46ch;
      color: var(--muted);
      font-size: 1rem;
    }
    .count-chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .count-chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px var(--teal-tint);
    }

    /* Layout */
    .layout {
      display: grid;
      gap: 24px;
      align-items: start;
      animation: rise .55s .08s ease-out both;
    }
    @media (min-width: 880px) {
      .layout { grid-template-columns: 340px minmax(0, 1fr); gap: 28px; }
      .form-panel { position: sticky; top: 24px; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .form-panel { padding: 22px; }
    .form-panel h2,
    .list-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: -0.01em;
    }
    .panel-note {
      margin: 6px 0 18px;
      color: var(--muted);
      font-size: .85rem;
    }

    /* Form */
    .field + .field { margin-top: 14px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: .85rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
      font: inherit;
      color: var(--ink);
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    input::placeholder { color: #8796a6; }
    input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px var(--accent-tint);
    }
    button {
      font: inherit;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
    }
    button:active { transform: translateY(1px); }
    button:focus-visible {
      outline: 3px solid #b9d6d1;
      outline-offset: 2px;
    }
    .add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 18px;
      padding: 13px 16px;
      background: var(--ink);
      color: #fff;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }
    .add:hover { background: #1f2d3d; }
    .add:disabled { opacity: .7; cursor: progress; }
    .add svg { width: 16px; height: 16px; }

    /* Status */
    .status {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin: 16px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: .85rem;
      line-height: 1.45;
    }
    .status:not(:empty) { display: flex; }
    .status::before {
      content: "";
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      margin-top: .45em;
      border-radius: 50%;
      background: currentColor;
    }
    .status.ok { background: var(--teal-tint); color: var(--teal); }
    .status.err { background: var(--danger-tint); color: var(--danger); }
    .status:not(.ok):not(.err) { background: var(--accent-tint); color: var(--accent-strong); }

    /* Device list */
    .list-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 12px;
    }
    .list-hint { color: var(--muted); font-size: .8rem; }
    .devices { display: grid; gap: 14px; }
    .device {
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .device:hover {
      transform: translateY(-1px);
      border-color: #c4d2e2;
      box-shadow: var(--shadow-md);
    }
    .device.sent {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-tint);
    }
    .device-top {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .status-dot {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px var(--teal-tint);
    }
    .device h3 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--display);
      font-size: 1.2rem;
      letter-spacing: -0.01em;
    }
    .url {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 6px 0 16px;
      color: var(--muted);
      font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
      font-size: .78rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .actions { display: flex; gap: 10px; align-items: stretch; }
    .trigger {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 16px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 8px 18px -10px rgba(194, 65, 12, .75);
    }
    .trigger:hover { background: var(--accent-strong); }
    .trigger:disabled { opacity: .78; cursor: progress; }
    .trigger svg { width: 17px; height: 17px; }
    .remove {
      flex: 0 0 auto;
      padding: 0 14px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }
    .remove:hover {
      color: var(--danger);
      border-color: #f0c9c4;
      background: var(--danger-tint);
    }
    .remove:disabled { opacity: .6; cursor: progress; }

    /* Empty state */
    .empty-state {
      display: grid;
      place-items: center;
      padding: 46px 22px;
      border: 1px dashed #c9d6e5;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .55);
      text-align: center;
    }
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 10px;
      color: #9fb3c8;
    }
    .empty-state p { margin: 0; color: var(--muted); font-size: .9rem; max-width: 32ch; }
    .empty-state strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-family: var(--display);
      font-size: 1.05rem;
    }

    /* Spinner + motion */
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 640px) {
      main { padding-top: 26px; }
      .hero { flex-direction: column; gap: 16px; }
      .list-head { flex-direction: column; gap: 4px; }
      .actions { flex-direction: column; }
      .remove { padding: 11px 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-copy">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2.5" width="10" height="19" rx="2.5"></rect>
              <path d="M11.5 18.5h3"></path>
              <path d="M5 7.5a7 7 0 0 1 0 9"></path>
              <path d="M2.5 5a11 11 0 0 1 0 14"></path>
            </svg>
          </span>
          <span>Tín hiệu nhà</span>
        </div>
        <h1>Bấm một nút.<br>Bé tạm dừng xem.</h1>
        <p class="lead">Lưu webhook MacroDroid cho từng thiết bị, rồi kích hoạt khi cần nhắc bé cất điện thoại.</p>
      </div>
      <div class="hero-side">
        <span class="count-chip" id="count">0 thiết bị</span>
      </div>
    </header>

    <div class="layout">
      <aside class="panel form-panel" aria-label="Thêm thiết bị">
        <h2>Thêm thiết bị</h2>
        <p class="panel-note">URL webhook chỉ nằm trên máy chủ của bạn.</p>
        <form id="form">
          <div class="field">
            <label for="name">Tên thiết bị</label>
            <input id="name" name="name" required maxlength="80" placeholder="Ví dụ: Máy của bé">
          </div>
          <div class="field">
            <label for="url">URL webhook</label>
            <input id="url" name="url" required type="url" maxlength="2000" placeholder="https://...">
          </div>
          <button class="add" type="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            Lưu thiết bị
          </button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </aside>

      <section class="list-panel" aria-label="Danh sách thiết bị">
        <div class="list-head">
          <h2>Thiết bị</h2>
          <span class="list-hint">Nhấn kích hoạt để gửi tín hiệu</span>
        </div>
        <div id="devices" class="devices"></div>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("form");
    const list = document.getElementById("devices");
    const status = document.getElementById("status");
    const count = document.getElementById("count");
    let devices = [];

    function setStatus(msg, kind = "") {
      status.textContent = msg;
      status.className = "status" + (kind ? " " + kind : "");
    }

    async function api(path, options = {}) {
      const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!r.ok) {
        let detail = "Có lỗi xảy ra.";
        try { detail = (await r.json()).detail || detail; } catch {}
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return r.status === 204 ? null : r.json();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function render() {
      count.textContent = `${devices.length} thiết bị`;
      if (!devices.length) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="18" y="8" width="28" height="48" rx="6"></rect>
              <path d="M28 51h8"></path>
              <path d="M27 26l10 6-10 6V26Z" fill="currentColor" stroke="none"></path>
              <path d="M50 18a9 9 0 0 1 0 12"></path>
              <path d="M55 13a16 16 0 0 1 0 22"></path>
            </svg>
            <p><strong>Chưa có thiết bị nào</strong>Thêm webhook MacroDroid để bắt đầu.</p>
          </div>`;
        return;
      }
      list.innerHTML = devices.map((d) => `
        <article class="device">
          <div class="device-top">
            <span class="status-dot" aria-hidden="true"></span>
            <h3 title="${escapeHtml(d.name)}">${escapeHtml(d.name)}</h3>
          </div>
          <p class="url" title="${escapeHtml(d.url)}">${escapeHtml(d.url)}</p>
          <div class="actions">
            <button class="trigger" data-id="${escapeHtml(d.id)}" data-name="${escapeHtml(d.name)}">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"></path>
              </svg>
              Kích hoạt
            </button>
            <button class="remove" data-remove="${escapeHtml(d.id)}" aria-label="Xóa ${escapeHtml(d.name)}">Xóa</button>
          </div>
        </article>
      `).join("");
    }

    async function load() {
      devices = await api("/api/devices");
      render();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = form.name.value.trim();
      const url = form.url.value.trim();
      if (!name || !url) return;
      const btn = form.querySelector(".add");
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Đang lưu...';
      try {
        await api("/api/devices", { method: "POST", body: JSON.stringify({ name, url }) });
        form.reset();
        setStatus("Đã lưu thiết bị.", "ok");
        await load();
      } catch (err) {
        setStatus(err.message, "err");
      } finally {
        btn.disabled = false;
        btn.innerHTML = label;
      }
    });

    list.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      if (btn.dataset.remove) {
        if (!confirm("Xóa thiết bị này?")) return;
        btn.disabled = true;
        try {
          await api(`/api/devices/${btn.dataset.remove}`, { method: "DELETE" });
          setStatus("Đã xóa thiết bị.");
          await load();
        } catch (err) {
          setStatus(err.message, "err");
          btn.disabled = false;
        }
        return;
      }

      if (btn.dataset.id) {
        const card = btn.closest(".device");
        const label = btn.innerHTML;
        btn.setAttribute("aria-busy", "true");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Đang gửi...';
        setStatus(`Đang gửi tín hiệu tới "${btn.dataset.name}"...`);
        try {
          const res = await api(`/api/devices/${btn.dataset.id}/trigger`, { method: "POST" });
          setStatus(`Đã kích hoạt "${res.name}" (HTTP ${res.status_code}).`, "ok");
          card.classList.add("sent");
          setTimeout(() => card.classList.remove("sent"), 1400);
        } catch (err) {
          setStatus(err.message, "err");
        } finally {
          btn.removeAttribute("aria-busy");
          btn.disabled = false;
          btn.innerHTML = label;
        }
      }
    });

    load().catch((err) => setStatus(err.message, "err"));
  </script>
</body>
</html>
